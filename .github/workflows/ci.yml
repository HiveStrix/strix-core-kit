name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      # go vet NO ve un método que se reenvía a sí mismo: compila, pasa el vet y
      # mata el proceso en producción. Uno de esos (InTx) tiró core-expenses con
      # OOMKilled en cada alta de compra, sin dejar rastro en el log
      # (strix-expenses#8). staticcheck lo marca como SA5007.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
