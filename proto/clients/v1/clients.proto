// Perfil crediticio (1:1 con el cliente)
message CreditProfile {
  uint32 id = 1;
  string representative_name = 2;
  string representative_id_type = 3;
  string representative_id_number = 4;
  string guarantor_name = 5;
  string guarantor_id_type = 6;
  string guarantor_id_number = 7;
  string guarantor_phone = 8;
  double credit_limit = 9;
  string credit_notes = 10;
  string created_at = 11;
  string updated_at = 12;
}

message CreditProfileInput {
  string representative_name = 1;
  string representative_id_type = 2;
  string representative_id_number = 3;
  string guarantor_name = 4;
  string guarantor_id_type = 5;
  string guarantor_id_number = 6;
