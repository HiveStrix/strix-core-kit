  CreditProfileInput input = 2;
}

// Perfil de proveedor (1:1 con el tercero). Sin id propio a propósito: la
// tabla client_supplier_profiles usa client_id como llave primaria, no un
// bigserial aparte — a diferencia de CreditProfile, que sí lo tiene.
message SupplierProfile {
  bool issues_receipt = 1;
  int32 credit_days = 2;
  string payment_terms = 3;
  string created_at = 4;
  string updated_at = 5;
}

message SupplierProfileInput {
  bool issues_receipt = 1;
  int32 credit_days = 2;
  string payment_terms = 3;
}

message GetSupplierProfileRequest {
  uint32 client_id = 1;
}
message UpsertSupplierProfileRequest {
  uint32 client_id = 1;
  SupplierProfileInput input = 2;
}

// Documentos adjuntos del expediente
message AttachedDocument {
  uint32 id = 1;
  string document_type = 2;
  string file_name = 3;
  string file_url = 4;
  string description = 5;
  // uploaded_by es un subject-id de strix-auth; vacío = desconocido.
  string uploaded_by = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
  // warning explica un descarte silencioso del que el usuario debe enterarse:
  // hoy, una URL rechazada por no usar un esquema web seguro. Vacio = sin
  // aviso. El descarte en si es la regla de seguridad y no cambia.
  string warning = 10;
}

message AttachedDocumentInput {
  string document_type = 1;
  string file_name = 2;
  // file_url: solo se admite http(s) — otros esquemas se descartan
  // (fail-closed anti-XSS).
  string file_url = 3;
  string description = 4;
  optional bool is_active = 5;
}

message ListAttachedDocumentsRequest {
  uint32 client_id = 1;
}
message ListAttachedDocumentsResponse {
  repeated AttachedDocument documents = 1;
}
message CreateAttachedDocumentRequest {
  uint32 client_id = 1;
  AttachedDocumentInput input = 2;
}
message UpdateAttachedDocumentRequest {
  uint32 client_id = 1;
  uint32 id = 2;
  AttachedDocumentInput input = 3;
}
message DeleteAttachedDocumentRequest {
  uint32 client_id = 1;
  uint32 id = 2;
}
